name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            if npm ci --prefer-offline --registry=https://registry.npmjs.org; then
              break
            fi
            echo "npm ci attempt $i failed, retrying..."
            sleep 5
            if [ "$i" = "3" ]; then
              exit 1
            fi
          done

      - name: Check mobile runtime
        run: npm run check:runtime

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (subpath base for GitHub Pages)
        run: npx vite build --base=/dorm-management/ --outDir dist/client

      - name: Prepare SPA fallback (404.html)
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
